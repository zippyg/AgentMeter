name: AgentMeteriOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  AgentMeteriOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AgentMeteriOS
      - path: Shared
    dependencies:
      - target: AgentMeterWidget
        embed: true
    info:
      path: AgentMeteriOS/Info.plist
      properties:
        CFBundleDisplayName: AgentMeter
        CFBundleName: AgentMeter
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFBundleDocumentTypes:
          - CFBundleTypeName: AgentMeter Snapshot
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.json
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: AgentMeter Pairing
            CFBundleURLSchemes:
              - agentmeter
        NSLocalNetworkUsageDescription: AgentMeter uses your local network to sync sanitized Claude and Codex usage snapshots from your Mac.
        NSBonjourServices:
          - _agentmeter._tcp
        NSSupportsLiveActivities: true
        AgentMeterAppGroupIdentifier: group.com.zain.agentmeter.dev
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AgentMeteriOS/AgentMeteriOS.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6663RG4DA4
        PRODUCT_BUNDLE_IDENTIFIER: com.zain.agentmeter.ios.dev
        PRODUCT_NAME: AgentMeter
        PROVISIONING_PROFILE_SPECIFIER: ""
        TARGETED_DEVICE_FAMILY: "1,2"
  AgentMeterWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AgentMeterWidget
      - path: Shared
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: AgentMeterWidget/Info.plist
      properties:
        CFBundleDisplayName: AgentMeter
        CFBundleName: AgentMeterWidget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
        AgentMeterAppGroupIdentifier: group.com.zain.agentmeter.dev
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AgentMeterWidget/AgentMeterWidget.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6663RG4DA4
        PRODUCT_BUNDLE_IDENTIFIER: com.zain.agentmeter.ios.dev.widget
        PRODUCT_NAME: AgentMeterWidget
        PROVISIONING_PROFILE_SPECIFIER: ""
        TARGETED_DEVICE_FAMILY: "1,2"
  AgentMeteriOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: Shared
    dependencies:
      - sdk: XCTest.framework
    info:
      path: Tests/Info.plist
      properties:
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zain.agentmeter.ios.dev.tests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  AgentMeteriOS:
    build:
      targets:
        AgentMeteriOS: all
        AgentMeterWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentMeteriOSTests
